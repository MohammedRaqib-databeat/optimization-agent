<template>
    <lightning-card title="Google Ad Manager" icon-name="standard:orders">
        <div class="slds-p-horizontal_medium slds-p-bottom_medium">

            <template if:true={isLoading}>
                <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
            </template>

            <template if:false={isLoading}>
                <template if:true={status.isPushed}>
                    <p class="slds-text-body_small slds-m-bottom_small">
                        Pushed to Google Ad Manager as Order <strong>{status.gamOrderId}</strong>.
                    </p>
                    <lightning-button
                        variant="destructive"
                        label="Delete from Google Ad Manager"
                        onclick={handleDeleteClick}
                        disabled={isProcessing}>
                    </lightning-button>
                </template>

                <template if:false={status.isPushed}>
                    <p class="slds-text-body_small slds-m-bottom_small">
                        Not yet pushed to Google Ad Manager.
                    </p>
                    <lightning-button
                        variant="brand"
                        label="Push to Google Ad Manager"
                        onclick={handlePushClick}
                        disabled={isProcessing}>
                    </lightning-button>
                </template>
            </template>

        </div>
    </lightning-card>

    <template if:true={showConfirmModal}>
        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open slds-modal_small">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <h2 class="slds-text-heading_medium">{confirmTitle}</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    <p>{confirmMessage}</p>
                </div>
                <footer class="slds-modal__footer">
                    <lightning-button
                        label="Cancel"
                        onclick={handleCancel}
                        disabled={isProcessing}
                        class="slds-m-right_x-small">
                    </lightning-button>
                    <lightning-button
                        variant="destructive"
                        label="Confirm"
                        onclick={handleConfirm}
                        disabled={isProcessing}>
                    </lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
